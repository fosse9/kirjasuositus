<!doctype html>
<title>Uusi kirjasuositus</title>

<h1>Uusi kirjasuositus</h1>

{% for error in errors %}
<p>{{ error }}</p>
{% endfor %}

<form action="/create_book" method="post">
  <p>
    Kirjan nimi (enintään 100 merkkiä):<br>
    <input type="text" name="title" value="{{ request.form.get('title', '') }}" required>
  </p>

  <p>
    Kirjailija (enintään 100 merkkiä):<br>
    <input type="text" name="author" value="{{ request.form.get('author', '') }}" required>
  </p>

  <p>
    Kuvaus (enintään 5000 merkkiä):<br>
    <textarea name="description" rows="6" cols="50" required>{{ request.form.get('description', '') }}</textarea>
  </p>

  <input type="submit" value="Lisää">
</form>

<p><a href="/">Takaisin</a></p>
